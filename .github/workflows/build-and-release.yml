name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile universal_usb_parser.exe
        run: |
          cl /nologo /std:c++17 /O2 /EHsc /W3 /DWIN32_LEAN_AND_MEAN makcu_hid_extractor.cpp /Fe:universal_usb_parser.exe /link /OPT:REF /OPT:ICF
          copy universal_usb_parser.exe makcu_hid_extractor.exe

      - name: Create release zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path universal_usb_parser.exe, makcu_hid_extractor.exe, README.md, build.cmd -DestinationPath universal-usb-parser-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-usb-parser-windows
          path: |
            universal_usb_parser.exe
            universal-usb-parser-windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Universal USB Parser (Latest)' }}
          body: |
            ## Universal USB Parser (Automated Build)

            Standalone Win32 portable executable for Windows 10 and 11.
            Zero Python or external runtime dependencies.

            ### Included Binaries:
            - `universal_usb_parser.exe`
            - `universal-usb-parser-windows.zip`
          files: |
            universal_usb_parser.exe
            universal-usb-parser-windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
