name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source-only checkout
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tracked files.' }
          $excluded = @($tracked | Where-Object {
            $_ -match '(^|/)(tests|fixtures|captures|_baseline|_test_output|_verification[^/]*|_runtime_regression|_hid_fallback_regression)/' -or
            $_ -match '(^|/)VALIDATION\.md$' -or
            $_ -match '\.(exe|dll|obj|o|pdb|ilk|lib|exp|pch|bin|zip|rar|7z|ppd|hid|observed|dmp|pcap|pcapng|json|log)$' -or
            ($_ -match '\.txt$' -and $_ -notmatch '^LICENSES/[^/]+\.txt$')
          })
          if ($excluded.Count -gt 0) { throw ('Excluded files are tracked: ' + ($excluded -join ', ')) }

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows executable
        run: cmd /c build.cmd

      - name: Verify executable startup and compatibility copy
        shell: pwsh
        run: |
          $help = & .\universal_usb_parser.exe --help
          if ($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch '--ppd-file') {
            throw 'Executable help smoke check failed.'
          }
          $licenses = & .\universal_usb_parser.exe --licenses
          if ($LASTEXITCODE -ne 0 -or ($licenses -join "`n") -notmatch 'Redistribution and use') {
            throw 'Embedded license smoke check failed.'
          }
          cmd /c fc /b universal_usb_parser.exe makcu_hid_extractor.exe
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility executable differs from the production executable.' }

      - name: Create release zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path universal_usb_parser.exe, makcu_hid_extractor.exe, README.md, SCHEMA.md, THIRD_PARTY_NOTICES.md, LICENSES -DestinationPath universal-usb-parser-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-usb-parser-windows
          path: |
            universal_usb_parser.exe
            universal-usb-parser-windows.zip
            THIRD_PARTY_NOTICES.md
            LICENSES/HIDAPI-BSD.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "latest" }
          if ($tag -eq "latest") {
            gh release delete latest --yes 2>$null
            git tag -d latest 2>$null
            git push origin :refs/tags/latest 2>$null
          }
          gh release create $tag universal_usb_parser.exe universal-usb-parser-windows.zip THIRD_PARTY_NOTICES.md LICENSES/HIDAPI-BSD.txt `
            --target $env:GITHUB_SHA `
            --title "Universal USB Parser ($tag)" `
            --notes "## Universal USB Parser`n`nStandalone Win32 portable executable for Windows 10 and 11.`nZero Python or external runtime dependencies.`n`n### Assets:`n- universal_usb_parser.exe`n- universal-usb-parser-windows.zip"

