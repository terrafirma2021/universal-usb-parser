name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile universal_usb_parser.exe
        run: |
          cl /nologo /std:c++17 /O2 /EHsc /W3 /DWIN32_LEAN_AND_MEAN makcu_hid_extractor.cpp /Fe:universal_usb_parser.exe /link /OPT:REF /OPT:ICF
          copy universal_usb_parser.exe makcu_hid_extractor.exe

      - name: Create release zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path universal_usb_parser.exe, makcu_hid_extractor.exe, README.md, build.cmd -DestinationPath universal-usb-parser-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-usb-parser-windows
          path: |
            universal_usb_parser.exe
            universal-usb-parser-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "latest" }
          if ($tag -eq "latest") {
            gh release delete latest --yes 2>$null
            git tag -d latest 2>$null
            git push origin :refs/tags/latest 2>$null
          }
          gh release create $tag universal_usb_parser.exe universal-usb-parser-windows.zip `
            --title "Universal USB Parser ($tag)" `
            --notes "## Universal USB Parser`n`nStandalone Win32 portable executable for Windows 10 and 11.`nZero Python or external runtime dependencies.`n`n### Assets:`n- universal_usb_parser.exe`n- universal-usb-parser-windows.zip"

